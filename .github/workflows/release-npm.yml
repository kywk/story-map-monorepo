name: Release npm libraries

on:
  push:
    tags:
      - 'npm-v*'

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@12.6.0
      - name: Validate release tag and versions
        run: node scripts/release-npm.mjs --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify packed packages in an isolated consumer
        env:
          RELEASE_PACK_DIR: ${{ runner.temp }}/story-map-release
        run: node scripts/release-npm.mjs
      - name: Publish libraries through npm OIDC
        env:
          RELEASE_PACK_DIR: ${{ runner.temp }}/story-map-release
        run: node scripts/release-npm.mjs --publish
